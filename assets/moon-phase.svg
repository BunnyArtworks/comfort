<svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="moon-fill" x1="16" y1="4" x2="42" y2="57" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FFFF"/>
      <stop offset="1" stop-color="#E5E8FF"/>
    </linearGradient>
    <linearGradient id="moon-shade" x1="31" y1="30" x2="60" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7389B8" stop-opacity="0"/>
      <stop offset="0.48" stop-color="#7389B8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#435B8A" stop-opacity="0.72"/>
